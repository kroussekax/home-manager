[audio]
enable_notification_sounds = false
enable_volume_sounds = false
sound_volume = 0.19999999552965164

[bar.default]
center = [ "active_window", "notifications", "clock", "media" ]
end = [ "tray", "network", "bluetooth", "volume", "battery", "session" ]
margin_ends = 95
start = [ "workspaces" ]

[calendar]
enabled = true

    [calendar.account.kax]
    name = "kax"
    provider = "custom"
    server_url = "https://mc.tail007dd4.ts.net/remote.php/dav"
    type = "caldav"
    username = "kax"

[location]
address = "medan, indonesia"
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 800.0
    cy = 810.41644287109375
    output = "eDP-1"
    placement_height = 1000.0
    placement_width = 1600.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
app_icon_color = "primary"
niri_overview_type_to_launch_enabled = true
show_close_buttons = false

    [shell.animation]
    speed = 2.1500000320374966

[theme]
builtin = "Catppuccin"
mode = "dark"
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "cava", "gtk3", "gtk4", "niri", "qt" ]

[wallpaper]
enabled = true

    [wallpaper.default]
    path = "~/nextcloud/Wallpapers/SORRY.png"

[widget.media]
art_size = 8
hide_album_art = true
max_length = 150
min_length = 150
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.workspaces]
active_pill_size = 1.5
hide_when_empty = true
show_labels = false
